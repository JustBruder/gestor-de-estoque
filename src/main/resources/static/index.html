<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Estoque - Kame Lanches</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        h1 {
            color: #ff7f00;
            font-size: 2.5rem;
            margin-bottom: 5px;
        }
        .nav-tabs {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .nav-tabs button {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid #ff7f00;
            color: #fff;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        .nav-tabs button:hover, .nav-tabs button.active {
            background: #ff7f00;
            color: #121212;
            box-shadow: 0 0 15px rgba(255, 127, 0, 0.4);
        }
        .section-content {
            display: none;
            max-width: 1000px;
            margin: 0 auto;
        }
        .section-content.active {
            display: block;
        }
        .card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        input, select {
            width: 100%;
            padding: 12px;
            margin: 8px 0 15px 0;
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 6px;
            color: #fff;
        }
        button.btn-principal {
            background: linear-gradient(135deg, #ff7f00, #e67e22);
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
            transition: 0.2s;
        }
        button.btn-principal:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #333;
        }
        th {
            color: #ff7f00;
        }
        .btn-excluir {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
        }
        .login-container {
            max-width: 400px;
            margin: 80px auto;
            padding: 30px;
            background: rgba(255,255,255,0.03);
            border: 1px solid #333;
            border-radius: 12px;
        }
    </style>
</head>
<body>

    <!-- TELA DE LOGIN (Caso não esteja logado) -->
    <div id="telaLogin" class="login-container" style="display: none;">
        <h2>Login - Gestor de Estoque</h2>
        <form onsubmit="fazerLogin(event)">
            <label>E-mail</label>
            <input type="email" id="loginEmail" required placeholder="seu@email.com">
            <label>Senha</label>
            <input type="password" id="loginSenha" required placeholder="Sua senha">
            <button type="submit" class="btn-principal">Entrar</button>
        </form>
    </div>

    <!-- APLICAÇÃO PRINCIPAL -->
    <div id="appPrincipal">
        <header>
            <h1>Gestor de Estoque</h1>
            <p>Kame Lanches</p>
            <button onclick="fazerLogout()" style="background: transparent; border: 1px solid #e74c3c; color: #e74c3c; padding: 5px 15px; border-radius: 15px; cursor: pointer;">Sair</button>
        </header>

        <!-- MENU DE NAVEGAÇÃO -->
        <div class="nav-tabs">
            <button onclick="mudarAba('pdv')" class="active">Check-list / PDV</button>
            <button onclick="mudarAba('cadastros')">Cadastros & Receitas</button>
            <button onclick="mudarAba('estoque')">Visão do Estoque</button>
        </div>

        <!-- ABA 1: PDV / LANCHES CADASTRADOS -->
        <div id="aba-pdv" class="section-content active">
            <h2>Lanches Cadastrados</h2>
            <div id="containerLanchesCadastrados"></div>

            <h2 style="margin-top: 30px;">Bebidas Cadastradas</h2>
            <div id="containerBebidas"></div>

            <h2 style="margin-top: 30px;">Outros Itens Cadastrados</h2>
            <div id="containerItensAvulsos"></div>
        </div>

        <!-- ABA 2: CADASTROS & RECEITAS -->
        <div id="aba-cadastros" class="section-content">
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px;">
                
                <!-- Cadastrar Insumo -->
                <div class="card">
                    <h3>Novo Insumo</h3>
                    <form onsubmit="salvarIngrediente(event)">
                        <label>Nome do Insumo</label>
                        <input type="text" id="nomeInsumo" required placeholder="Ex: Pão de Hambúrguer">
                        <label>Qtd Inicial</label>
                        <input type="number" id="qtdInsumo" required placeholder="Ex: 50">
                        <label>Unidade de Medida</label>
                        <input type="text" id="unidadeInsumo" required placeholder="Ex: UN ou GRAMAS">
                        <button type="submit" class="btn-principal">Salvar Insumo</button>
                    </form>
                </div>

                <!-- Cadastrar Lanche / Produto com Receita -->
                <div class="card">
                    <h3>Novo Lanche</h3>
                    <form onsubmit="cadastrarLanche(event)">
                        <label>Nome do Lanche</label>
                        <input type="text" id="nomeLanche" required placeholder="Ex: X-Burguer">
                        <label>Preço (R$)</label>
                        <input type="number" step="0.01" id="precoLanche" required placeholder="Ex: 25.00">
                        
                        <label>Ingredientes da Receita:</label>
                        <div id="containerIngredientesLanche"></div>
                        <button type="button" onclick="adicionarLinhaIngrediente()" style="background: #333; color: #ff7f00; border: 1px solid #ff7f00; padding: 8px; width: 100%; border-radius: 6px; margin: 10px 0 15px 0; cursor: pointer; font-weight: bold;">+ Ingrediente</button>

                        <button type="submit" class="btn-principal">Cadastrar Lanche</button>
                    </form>
                </div>

            </div>
        </div>

        <!-- ABA 3: VISÃO DO ESTOQUE (COM ESTOQUE BAIXO AUTOMÁTICO) -->
        <div id="aba-estoque" class="section-content">
            
            <!-- PAINEL DE ALERTA DE ESTOQUE BAIXO -->
            <div id="painelEstoqueBaixo" class="card" style="background: rgba(231, 76, 60, 0.1); border: 1px solid #e74c3c; display: none;">
                <h3 style="color: #e74c3c; margin-top: 0;">⚠️ Alerta de Estoque Baixo</h3>
                <div id="containerEstoqueBaixo" style="display: flex; flex-direction: column; gap: 8px;"></div>
            </div>

            <div class="card">
                <h2>Estoque Geral de Insumos</h2>
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Insumo</th>
                            <th>Quantidade</th>
                            <th>Unidade</th>
                            <th>Ação</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaInsumos">
                        <!-- Preenchido via JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- SCRIPTS -->
    <script src="app.js"></script>
    <script>
        // Função simples para alternar entre as abas na tela
        function mudarAba(abaId) {
            document.querySelectorAll('.section-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-tabs button').forEach(el => el.classList.remove('active'));

            document.getElementById(`aba-${abaId}`).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        // Verifica estado inicial do Login
        window.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('token');
            if (!token) {
                document.getElementById('telaLogin').style.display = 'block';
                document.getElementById('appPrincipal').style.display = 'none';
            }
        });
    </script>
</body>
</html>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
